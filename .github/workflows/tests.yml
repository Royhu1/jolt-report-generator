# The offline test suite, on every push and every pull request.
#
# The suite needs no secrets and no network beyond the package install: sockets
# are blocked for the whole pytest session and every SRF / OpenWeather / geocoder
# call is injected or mocked (see tests/README.md). Nothing here may therefore
# depend on a local cache, a key or a machine-specific path.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.11, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install the runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the offline test suite
        env:
          PYTHONUTF8: "1"
        run: pytest -q
