# Tool configuration only. ``report_generator`` is a vendored code workspace,
# NOT an installable package: there is no build-system / [project] table, no
# wheel and no console script. Runtime dependencies are in requirements.txt,
# the version constants in report_generator/version.py, and the version history
# in doc/versions.md. `pip install .` here intentionally fails — put the
# repository root on the import path (PYTHONPATH=. or a site-packages .pth)
# instead.

[tool.pytest.ini_options]
# Put the repository root on sys.path for the test session (pytest >=7 built-in
# rootdir-relative prepend) so `pytest` from the repo root works without any
# install or exported PYTHONPATH.
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.isort]
# "black" profile keeps isort's import ordering compatible with black's
# formatting (trailing commas, parenthesised multi-line imports) so the two
# tools do not fight. Three groups: stdlib / third-party / first-party.
profile = "black"
